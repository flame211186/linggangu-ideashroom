name: Feature request / 功能建议
description: Describe the problem you want to solve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve? / 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior / 期望的使用方式
